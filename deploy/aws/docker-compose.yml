# Se ejecuta en la instancia: cd /opt/856 && IMAGE_TAG=<sha> docker compose --env-file stack.env up -d
# stack.env (no secreto): DOMAIN, ACME_EMAIL, IMAGE_REPO. app.env (no secreto): ver deploy/aws/README.md.
# Los secretos NO viajan por variables de entorno del host: la app los carga de SSM al arrancar (src/bootstrap.ts).
services:
  app:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    restart: unless-stopped
    env_file: app.env
    expose: ["8080"]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
