# Droplet prod856-app. Se ejecuta en /opt/856:  IMAGE_TAG=<tag> docker compose --env-file stack.env up -d
# stack.env (no secreto): DOMAIN, ACME_EMAIL, IMAGE_REPO.
# app.env (SECRETO, permisos 600, solo en el droplet): variables de la app. NO contiene llaves: SIGNER_BACKEND=remote.
services:
  app:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    restart: unless-stopped
    env_file: app.env
    expose: ["8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
