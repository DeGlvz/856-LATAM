name: deploy-do
# Producción en DigitalOcean (NYC1). Solo por tag vX.Y.Z:
#   validar → imagen en GHCR (ghcr.io/deglvz/cripto-api:<tag>) → SSH al droplet prod856-app → compose up → health → rollback si falla.
# El firmante (prod856-signer) NO se despliega aquí: al reiniciar queda bloqueado. Ver deploy-signer.yml.
# Configuración del repositorio:
#   secrets.DO_SSH_KEY      llave privada de despliegue (su pública va en DEPLOY_PUBKEY de harden.sh)
#   vars.DO_APP_HOST        IP pública reservada de prod856-app
#   vars.DO_KNOWN_HOSTS     salida de: ssh-keyscan -t ed25519 <DO_APP_HOST>
on:
  push:
    tags: ['v*.*.*']
concurrency:
  group: deploy-do
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
env:
  IMAGE_REPO: ghcr.io/deglvz/cripto-api
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.ref_name }}
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy-app:
    if: vars.DO_APP_HOST != ''
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Llave SSH
        env:
          KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN: ${{ vars.DO_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Desplegar en prod856-app
        env:
          HOST: ${{ vars.DO_APP_HOST }}
          TAG: ${{ github.ref_name }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scp -q deploy/do/app/docker-compose.yml deploy/do/app/Caddyfile deploy@"$HOST":/opt/856/
          # El token de GitHub es efímero (vence al terminar este job): en el droplet no queda credencial del registro.
          ssh deploy@"$HOST" "TAG='$TAG' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/856
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          [ -f current-tag ] && cp current-tag previous-tag || true
          export IMAGE_TAG="$TAG"
          docker compose --env-file stack.env pull app
          docker compose --env-file stack.env up -d --remove-orphans
          docker logout ghcr.io >/dev/null
          for i in $(seq 1 30); do
            if docker compose --env-file stack.env exec -T app wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "$TAG" > current-tag; echo "deploy ok: $TAG"; exit 0
            fi
            sleep 5
          done
          echo "health check fallido; vuelvo a la versión anterior"
          if [ -f previous-tag ]; then export IMAGE_TAG="$(cat previous-tag)"; docker compose --env-file stack.env up -d --remove-orphans; fi
          exit 1
          REMOTE
