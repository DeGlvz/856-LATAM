name: deploy-aws
# Produccion en AWS (us-east-2): build arm64 -> push a ECR -> ssm send-command a la instancia (sin SSH).
# Requiere la variable de repositorio AWS_DEPLOY_ROLE_ARN y AWS_INSTANCE_ID (salidas de deploy/aws/856-prod.yaml). No hay secretos en GitHub.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
concurrency:
  group: deploy-aws
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: 856-latam-app
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Desplegar en la instancia (SSM Run Command)
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SCRIPT=$(cat <<REMOTE
          set -euo pipefail
          cd /opt/856
          if [ -f current-tag ]; then cp current-tag previous-tag; fi
          echo '$(base64 -w0 deploy/aws/docker-compose.yml)' | base64 -d > docker-compose.yml
          echo '$(base64 -w0 deploy/aws/Caddyfile)' | base64 -d > Caddyfile
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY
          export IMAGE_TAG=$SHA
          docker compose --env-file stack.env pull
          docker compose --env-file stack.env up -d --remove-orphans
          for i in \$(seq 1 30); do
            if docker compose --env-file stack.env exec -T app wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo $SHA > current-tag
              echo "deploy ok: $SHA"
              exit 0
            fi
            sleep 5
          done
          echo "health check fallido; volviendo a la version anterior"
          if [ -f previous-tag ]; then
            export IMAGE_TAG=\$(cat previous-tag)
            docker compose --env-file stack.env up -d --remove-orphans
          fi
          exit 1
          REMOTE
          )
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $SHA" \
            --parameters "$(jq -cn --arg s "$SCRIPT" '{commands: [$s]}')" \
            --query Command.CommandId --output text)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output json
          [ "$STATUS" = "Success" ]
